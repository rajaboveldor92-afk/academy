name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter versiyasi
        run: flutter --version

      - name: Android platformasini tayyorlash
        run: bash tool/setup_android.sh

      - name: Statik tahlil
        run: flutter analyze --no-fatal-infos

      - name: Testlar
        run: flutter test

      - name: Release APK
        run: flutter build apk --release

      - name: APKni yuklab olish uchun saqlash
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
