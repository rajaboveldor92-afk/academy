name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter versiyasi
        run: flutter --version

      - name: Android platformasini tayyorlash
        run: |
          set -o pipefail
          bash tool/setup_android.sh 2>&1 | tee setup.log

      - name: Statik tahlil
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee analyze.log

      - name: Testlar
        run: |
          set -o pipefail
          flutter test --reporter expanded --no-color 2>&1 | tee test.log

      # Har build bir xil kalit bilan imzolanadi — yangi versiya eskisining ustiga o'rnatiladi
      # (bolalar progressi o'chmaydi). Secrets berilgan bo'lsa — o'sha shaxsiy kalit ishlatiladi.
      - name: Imzo kaliti
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          store="$PWD/android/app/academy-release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$store"
            pass="$KEYSTORE_PASSWORD"; alias="$KEY_ALIAS"; keypass="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            echo "Shaxsiy kalit (secrets) ishlatiladi."
          else
            cp tool/signing/family-release.jks "$store"
            pass="academy-family"; alias="academy"; keypass="academy-family"
            echo "Oilaviy build kaliti (tool/signing) ishlatiladi."
          fi
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$store" "$pass" "$alias" "$keypass" > android/key.properties

      - name: Release APK
        run: |
          set -o pipefail
          out=build/app/outputs/flutter-apk
          mkdir -p dist
          flutter build apk --release 2>&1 | tee build.log
          cp $out/app-release.apk dist/academy-app-release.apk
          # Protsessor turiga bo'lingan kichik APK'lar (har biri ~18 MB).
          flutter build apk --release --split-per-abi 2>&1 | tee -a build.log
          cp $out/app-arm64-v8a-release.apk dist/academy-arm64-v8a.apk
          cp $out/app-armeabi-v7a-release.apk dist/academy-armeabi-v7a.apk
          # Talab qilingan yakuniy fayl nomi ham joyida qolsin.
          cp dist/academy-app-release.apk $out/app-release.apk
          ls -la dist

      - name: APKni Actions'ga saqlash
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # APK "latest-build" release sahifasida ham turadi — telefondan yuklab olish oson.
      - name: APKni Release'ga joylash
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build dist/academy-app-release.apk dist/academy-arm64-v8a.apk dist/academy-armeabi-v7a.apk \
            --title "Academy — oxirgi build" \
            --notes "Commit: ${GITHUB_SHA}. Telefonga o'rnatish: faylni yuklab oling va oching."

      # Xato bo'lsa, qisqa hisobot Issue sifatida yoziladi.
      - name: Xato hisoboti
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Commit: ${GITHUB_SHA}"
            for f in setup.log analyze.log test.log build.log; do
              [ -f "$f" ] || continue
              echo
              echo "### $f"
              echo '```'
              if [ "$f" = "test.log" ]; then
                { grep -n -B3 -A45 -E '\[E\]|EXCEPTION CAUGHT|Expected:|Error:|error:' "$f" || true; } | head -c 30000
                echo '...'
                tail -n 15 "$f"
              elif [ "$f" = "build.log" ]; then
                { grep -n -A25 -E 'What went wrong|FAILURE:|Error:|error:' "$f" || true; } | head -c 12000
                echo '...'
                tail -n 40 "$f" | tail -c 6000
              else
                tail -n 120 "$f" | tail -c 12000
              fi
              echo '```'
            done
            if [ -f android/app/build.gradle.kts ]; then
              echo
              echo "### android/app/build.gradle.kts"
              echo '```'
              head -c 6000 android/app/build.gradle.kts
              echo '```'
            fi
          } > report.md
          gh issue create --title "Build xatosi #${GITHUB_RUN_NUMBER}" --body-file report.md
